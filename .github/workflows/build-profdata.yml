name: Build PGO profile
run-name: PGO profile for r${{inputs.version}}${{inputs.revision}}
# Produces the frontend PGO profile the cross builds consume, one per
# llvm-project tree rather than one per target: a -fprofile-instr-use profile
# keys on function name and CFG hash and carries no target codegen, so a single
# file serves every triple we build from that tree. llvm_android relies on the
# same property, pointing one profdata at linux, at its mingw cross build and at
# a universal arm64+x86_64 darwin build.
#
# Assets land on the "profdata" tag named by the llvm revision, which is exactly
# what fetch-source.sh looks up. Re-running for an NDK release that shares a tree
# with one already profiled just overwrites it with an equivalent file, so there
# is no need to track which releases map to which tree by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "NDK Release version:"
        default: "30"
        required: true
      revision:
        description: "NDK Release revision:"
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  profdata:
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 5120
          swap-size-mb: 5120
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          build-mount-path: /mnt

      - name: Move Docker to /mnt
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          sudo rsync -aqP /var/lib/docker/ /mnt/docker/
          sudo rm -rf /var/lib/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker

      - name: Prepare /mnt/build
        run: |
          sudo mkdir -p /mnt/build
          sudo chown $(id -u):$(id -g) /mnt/build
          rmdir "$GITHUB_WORKSPACE"
          ln -s /mnt/build "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch source
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/llvm-builder:latest"
          docker run --rm \
            -v "/mnt/build:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/work \
            -e NDK_VERSION='${{ inputs.version }}' \
            -e NDK_REVISION='${{ inputs.revision }}' \
            -e ROOTDIR=/work \
            -e ENABLE_PGO=0 -e ENABLE_MLGO=0 \
            "$IMAGE" scripts/fetch-source.sh
          # shellcheck disable=SC1091
          . /mnt/build/.build-env
          echo "llvm_rev=$LLVM_REV" >> "$GITHUB_ENV"
          echo "Profiling $LLVM_REV (LLVM $LLVM_VERSION)"

      - name: Instrumented build + training run
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/llvm-builder:latest"
          docker run --rm \
            -v "/mnt/build:/work" -w /work --user "$(id -u):$(id -g)" \
            -e HOME=/work "$IMAGE" bash -euxo pipefail -c '
              . /work/.build-env
              # Native build with the image compiler. No stage1: we are not
              # bootstrapping a toolchain, only instrumenting one well enough to
              # count how often clang runs each function.
              #
              # LLVM_PROFDATA is the merge tool, not a build input, so pointing
              # it into this build tree is fine -- the file only has to exist by
              # the time the merge step runs, and being the same revision as the
              # instrumentation is what keeps the profraw format readable.
              cmake -S /work/llvm-project/llvm -B /work/instr -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DLLVM_ENABLE_PROJECTS=clang \
                -DLLVM_TARGETS_TO_BUILD="$LLVM_TARGETS" \
                -DLLVM_BUILD_INSTRUMENTED=ON \
                -DLLVM_INCLUDE_TESTS=ON \
                -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF \
                -DLLVM_ENABLE_RTTI=OFF -DLLVM_ENABLE_EH=OFF \
                -DLLVM_ENABLE_WARNINGS=OFF \
                -DLLVM_PROFDATA=/work/instr/bin/llvm-profdata
              cmake --build /work/instr --target llvm-profdata
              cmake --build /work/instr --target generate-profdata
            '

      - name: Package
        run: |
          src=$(find /mnt/build/instr -name clang.profdata | head -n1)
          test -n "$src"
          ls -lh "$src"
          xz -T0 -c "$src" > "/mnt/${{ env.llvm_rev }}.profdata.xz"
          ls -lh "/mnt/${{ env.llvm_rev }}.profdata.xz"

      - name: Upload release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: "profdata"
          artifacts: /mnt/${{ env.llvm_rev }}.profdata.xz
          allowUpdates: true
          replacesArtifacts: true
          body: 'Frontend PGO profiles, one per llvm-project revision. Consumed by fetch-source.sh.'
